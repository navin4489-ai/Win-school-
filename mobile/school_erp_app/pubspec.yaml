name: school_erp_app
description: Wintech Innovations School Management System mobile app.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  camera: ^0.12.2
  flutter:
    sdk: flutter
  geolocator: ^14.1.2
  http: ^1.2.2
  http_parser: ^4.1.2
  intl: ^0.19.0
  path_provider: ^2.1.6
  provider: ^6.1.2
  share_plus: ^13.3.1
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/logo.png
  adaptive_icon_background: "#12345c"
  adaptive_icon_foreground: assets/logo-foreground.png
